<h2><b>class Input</b></h2>
<p>Hilfsklasse, die die oben eingestellte Anzahl an Feldern liest.</p>
<h4>(Klassen-)Methoden:</h4>
<ul>
    <li><pre><code>public static int getFields(String[] args)</code>
Liest die Anzahl der Felder aus dem übergebenen Programmargument args und gibt sie als ganze Zahl zurück (bei einer
ungültigen Eingabe 32).</pre>
    </li>
</ul>
