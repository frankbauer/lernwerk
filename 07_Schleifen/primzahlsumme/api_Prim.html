<h2><b>class Prim</b></h2>
<p>Hilfsklasse zum Prüfen von Primzahlen.</p>
<h4>(Klassen-)Methoden:</h4>
<ul>
    <li><pre><code>public static boolean isPrim(int n)</code>
Gibt true zurück, wenn n eine Primzahl ist, sonst false. Zum Beispiel liefert Prim.isPrim(7) den Wert true und
Prim.isPrim(9) den Wert false.</pre>
    </li>
</ul>
