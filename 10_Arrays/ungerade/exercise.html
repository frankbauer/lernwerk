<h3>Aufgabe</h3>

    <b>verdoppelt</b> werden. Das Programm soll für beliebige Werte in <code>data</code> funktionieren.</p>
<p>Beispiel: Das Feld <code>{3, 2, 8, 5, 9, 1}</code> soll zu <code>{6, 2, 8, 10, 18, 2}</code> umgewandelt
    werden:</p>
<pre output>6, 2, 8, 10, 18, 2, </pre>
