<h2><b>class Color</b></h2>

<h4>Beschreibung</h4>
<p>Eine Klasse, die verschiedene Konstanten für die Farben einer Rakete repräsentiert.</p>

<h4>Klassenkonstanten</h4>
<ul>
    <li><code>RED</code> Eine rote Rakete (Standard).</li>
    <li><code>PURPLE</code> Eine violette Rakete.</li>
    <li><code>BLUE</code> Eine blaue Rakete.</li>
    <li><code>PINK</code> Eine pinke Rakete.</li>
    <li><code>WHITE</code> Eine weiße Rakete.</li>
</ul>
