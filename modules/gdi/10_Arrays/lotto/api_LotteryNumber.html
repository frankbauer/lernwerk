<h2><b>class LotteryNumber</b></h2>
<p>Eine zufällig gezogene Lottozahl aus dem Wertebereich 1 bis 49.</p>
<h4>Konstruktor:</h4>
<ul>
    <li><pre><code>LotteryNumber()</code>
Erzeugt eine neue Lottozahl mit einem zufälligen Wert.</pre></li>
</ul>
<h4>Methoden:</h4>
<ul>
    <li><pre><code>int getValue()</code>
Liefert den Wert der Lottozahl.</pre></li>
</ul>
