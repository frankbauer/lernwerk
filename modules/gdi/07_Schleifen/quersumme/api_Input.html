<h2><b>class Input</b></h2>
<p>Hilfsklasse, die die oben eingestellte Zahl liest.</p>
<h4>(Klassen-)Methoden:</h4>
<ul>
    <li><pre><code>public static int getNumber(String[] args)</code>
Liest die Zahl aus dem übergebenen Programmargument args und gibt sie als ganze Zahl zurück (bei einer ungültigen
Eingabe 4711).</pre>
    </li>
</ul>
