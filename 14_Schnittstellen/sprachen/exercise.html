<h3>Aufgabe</h3>
<p>Gegeben ist das Interface <code>Greeting</code>. Erstellen Sie eine <b>nicht öffentliche</b> Klasse
    <code>Deutsch</code>, die das Interface implementiert und beim Aufruf der Interface-Methode <code>Guten Tag</code>
    ausgibt.</p>
<p>Die weiteren Teilaufgaben stehen jeweils direkt über dem Eingabefeld, in das die Lösung gehört.</p>
