<h3>Aufgabe</h3>
<p>Implementieren Sie die Methode <code>wege</code> so, dass sie zurückgibt, wie viele <b>verschiedene Wege</b> vom
    Knoten <code>cur</code> zum Knoten mit dem Wert <code>ziel</code> führen. Es kann von einem zyklenfreien Graphen
    ausgegangen werden.</p>
<p>Bei richtiger Lösung gibt das Programm Folgendes aus:</p>
<pre output>Wege von 1: 6
Wege von 7: 0</pre>
